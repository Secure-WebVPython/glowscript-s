# Deploy GlowScript Sandbox to GitHub Pages
name: Deploy Sandbox Dev to Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-dev"  # ← Different from master to avoid conflicts
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build sandbox
        run: npm run build:sandbox

      - name: Deploy to dev subfolder
        id: deployment
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist-sandbox
          target-folder: dev
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}