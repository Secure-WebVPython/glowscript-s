name: Deploy Both Versions

on:
  push:
    branches: ["master", "dev"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build sandbox
        run: npm run build:sandbox

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist-sandbox
          target-folder: ${{ github.ref == 'refs/heads/master' && '.' || 'dev' }}
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}